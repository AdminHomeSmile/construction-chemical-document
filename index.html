<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Construction Chemical Document</title>
  <meta name="description" content="คลังเอกสารข้อมูลทางเทคนิค WetPROOF, RoofGUARD และ LOCKSURE" />
  <meta name="theme-color" content="#DC1F26" />
  <meta property="og:title" content="Construction Chemical Document" />
  <meta property="og:description" content="คลังเอกสารข้อมูลทางเทคนิค WetPROOF, RoofGUARD และ LOCKSURE" />
  <meta property="og:image" content="https://cdn.jsdelivr.net/gh/AdminHomeSmile/construction-chemical-document@main/public/og.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Construction Chemical Document" />
  <meta name="twitter:image" content="https://cdn.jsdelivr.net/gh/AdminHomeSmile/construction-chemical-document@main/public/og.jpg" />
  <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/AdminHomeSmile/construction-chemical-document@main/public/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f0e8; --fg: #161412; --muted: #6a6560; --surface: #fffdf9;
      --ink: #141210; --ink-muted: #b7b1a8; --brand: #dc1f26; --line: #d4cec2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans Thai", sans-serif; line-height: 1.5; }
    button, a.btn { cursor: pointer; }
    a { color: inherit; }
    header { position: sticky; top: 0; z-index: 10; background: #141210f2; color: var(--surface); border-bottom: 1px solid #2c2926; backdrop-filter: blur(8px); }
    .bar { max-width: 72rem; margin: 0 auto; height: 4rem; padding: 0 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
    .brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; }
    .mark { width: 2rem; height: 2rem; border-radius: .4rem; background: var(--brand); display: grid; place-items: center; }
    .brand-name { font-family: "Barlow Condensed", sans-serif; font-size: 1.05rem; font-weight: 700; letter-spacing: .04em; line-height: 1; }
    .brand-sub { font-size: .65rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); margin-top: .2rem; }
    .lang { display: flex; gap: .2rem; padding: .2rem; border: 1px solid #ffffff33; border-radius: .4rem; }
    .lang button { height: 2.2rem; min-width: 2.75rem; border: 0; border-radius: .3rem; background: transparent; color: var(--ink-muted); font: 600 .85rem/1 "IBM Plex Sans Thai", sans-serif; }
    .lang button.on { background: var(--brand); color: #fff; }
    .hero { background: var(--ink); color: var(--surface); }
    .hero-inner { max-width: 72rem; margin: 0 auto; padding: 3rem 1.25rem 3.5rem; }
    .eyebrow { font-size: .75rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-muted); }
    h1 { font-family: "Barlow Condensed", sans-serif; font-size: clamp(2.6rem, 7vw, 3.75rem); font-weight: 600; letter-spacing: .04em; line-height: .95; margin: .75rem 0 0; }
    .lead { max-width: 38rem; margin-top: 1.25rem; color: var(--ink-muted); font-size: 1.05rem; }
    .rule { width: 4rem; height: .25rem; background: var(--brand); margin-top: 2rem; }
    main { max-width: 72rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    .tools { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; justify-content: space-between; margin-bottom: 1.25rem; }
    h2 { font-family: "Barlow Condensed", sans-serif; font-size: 1.85rem; letter-spacing: .04em; margin: 0; }
    input[type=search] { height: 2.75rem; width: min(100%, 18rem); border: 1px solid var(--line); border-radius: .5rem; background: var(--surface); padding: 0 .9rem; font: 1rem/1 "IBM Plex Sans Thai", sans-serif; }
    .chips { display: flex; gap: .5rem; overflow: auto; padding-bottom: .25rem; }
    .chips button { height: 2.75rem; padding: 0 1rem; border-radius: .5rem; border: 1px solid var(--line); background: var(--surface); font: 500 .9rem/1 "IBM Plex Sans Thai", sans-serif; white-space: nowrap; }
    .chips button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; margin-top: 1.75rem; }
    @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    article { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; box-shadow: 0 12px 32px -18px #14121047; }
    .cover { position: relative; background: var(--ink); display: block; aspect-ratio: 3/4; overflow: hidden; }
    .cover img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .badge { position: absolute; left: .75rem; top: .75rem; background: var(--brand); color: #fff; font-family: "Barlow Condensed", sans-serif; font-size: .9rem; font-weight: 700; letter-spacing: .06em; padding: .2rem .5rem; border-radius: .2rem; }
    .body { display: flex; flex-direction: column; gap: .7rem; padding: 1rem; flex: 1; }
    .type { font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .name { font-family: "Barlow Condensed", sans-serif; font-size: 1.55rem; font-weight: 700; letter-spacing: .04em; line-height: 1; margin: .2rem 0 0; }
    .tag { font-size: .9rem; color: var(--muted); }
    .meta { font-size: .75rem; color: var(--muted); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: auto; }
    .btn { display: flex; align-items: center; justify-content: center; height: 2.75rem; border-radius: .45rem; text-decoration: none; font-weight: 600; font-size: .9rem; }
    .btn.primary { background: var(--brand); color: #fff; }
    .btn.ghost { border: 1px solid var(--line); background: var(--surface); }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 1rem; background: var(--surface); margin-top: 1.75rem; }
    .share { margin-top: 2.5rem; display: grid; grid-template-columns: 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; }
    @media (min-width: 800px) { .share { grid-template-columns: 240px 1fr; } }
    .share-qr { display: flex; align-items: center; justify-content: center; background: #f4f0e8; padding: 1.5rem; }
    .share-qr img { width: min(100%, 220px); aspect-ratio: 1; border-radius: .6rem; background: var(--surface); }
    .share-body { padding: 1.5rem; border-top: 1px solid var(--line); }
    @media (min-width: 800px) { .share-body { border-top: 0; border-left: 1px solid var(--line); } }
    .share h2 { font-size: 1.7rem; }
    .share p { color: var(--muted); margin: .6rem 0 0; }
    .share code { display: block; margin-top: 1rem; padding: .6rem .75rem; border: 1px solid var(--line); border-radius: .45rem; background: #f4f0e8; font-size: .72rem; word-break: break-all; color: var(--fg); }
    .share .actions { margin-top: 1rem; }
    footer { background: var(--ink); color: var(--surface); }
    .foot { max-width: 72rem; margin: 0 auto; padding: 2.5rem 1.25rem; display: grid; gap: 1.5rem; }
    @media (min-width: 800px) { .foot { grid-template-columns: 1.2fr 1fr; } }
    .foot h3 { font-family: "Barlow Condensed", sans-serif; font-size: 1.6rem; margin: 0; letter-spacing: .04em; }
    .foot p, .foot li { color: var(--ink-muted); font-size: .9rem; }
    .foot ul { list-style: none; padding: 0; margin: .75rem 0 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="#">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="20" height="20"><path d="M16 6.5c0 0 6.2 6.4 6.2 11.1A6.2 6.2 0 1 1 9.8 17.6C9.8 12.9 16 6.5 16 6.5Z" fill="#fffdf9"/></svg>
        </span>
        <span>
          <span class="brand-name">Construction Chemical</span>
          <span class="brand-sub">Document</span>
        </span>
      </a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="btn-th" class="on">ไทย</button>
        <button type="button" id="btn-en">EN</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <p class="eyebrow" data-i="count"></p>
      <h1 data-i="title"></h1>
      <p class="lead" data-i="lead"></p>
      <div class="rule"></div>
    </div>
  </section>

  <main>
    <div class="tools">
      <h2 data-i="catalog"></h2>
      <input id="q" type="search" />
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <p class="empty hidden" id="empty"></p>
    <section class="share">
      <div class="share-qr">
        <img src="qr.png" alt="QR Construction Chemical Document" width="220" height="220" />
      </div>
      <div class="share-body">
        <p class="eyebrow" data-i="qrEyebrow"></p>
        <h2 data-i="qrTitle"></h2>
        <p data-i="qrLead"></p>
        <code>https://adminhomesmile.github.io/construction-chemical-document/</code>
        <div class="actions">
          <a class="btn primary" href="qr.png" download="construction-chemical-document-qr.png" data-i="qrDownload"></a>
          <a class="btn ghost" href="qr-card.jpg" download="construction-chemical-document-qr-poster.jpg" data-i="qrPoster"></a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="foot">
      <div>
        <h3>Construction Chemical Document</h3>
        <p data-i="library"></p>
        <p data-i="note"></p>
      </div>
      <div>
        <p class="eyebrow" data-i="contact"></p>
        <p style="color:#fff;font-weight:600;margin:.75rem 0 0">SCG Distribution Co., Ltd.</p>
        <ul>
          <li>1 Poon Cement Thai Rd, Bang Sue, Bangkok 10800</li>
          <li>SCG HOME Contact Center 0-2586-2222</li>
          <li>Contact@scg.com</li>
        </ul>
      </div>
    </div>
  </footer>

  <script>
    const CDN = "https://cdn.jsdelivr.net/gh/AdminHomeSmile/construction-chemical-document@main/public";
    const ui = {
      count: { th: "8 เอกสาร · ฉบับ กรกฎาคม 2569", en: "8 documents · July 2026 · Rev. 01" },
      title: { th: "เอกสารข้อมูลทางเทคนิค", en: "Technical Data Sheets" },
      lead: {
        th: "รวบรวม TDS และคู่มือการใช้งาน 8 ฉบับ ของ WetPROOF, RoofGUARD และ LOCKSURE — ดาวน์โหลด PDF ได้ทันที",
        en: "Eight WetPROOF, RoofGUARD and LOCKSURE technical documents — open or download the original PDF."
      },
      catalog: { th: "เลือกเอกสารตามแบรนด์", en: "Browse by brand" },
      library: { th: "คลังเอกสารเคมีภัณฑ์ก่อสร้าง", en: "Construction Chemical Library" },
      note: { th: "ข้อมูลจากเอกสารทางเทคนิคต้นฉบับ ฉบับที่ 01 · กรกฎาคม 2026", en: "Sourced from original technical documents · Version 01 · July 2026" },
      contact: { th: "ติดต่อ", en: "Contact" },
      search: { th: "ค้นหาชื่อ รหัส หรือการใช้งาน", en: "Search name, code, or use" },
      details: { th: "เปิดเอกสาร", en: "Open PDF" },
      empty: { th: "ไม่พบเอกสารที่ตรงกับคำค้น", en: "No documents match this search." },
      pages: { th: "หน้า", en: "pages" },
      all: { th: "ทั้งหมด", en: "All" },
      qrEyebrow: { th: "QR", en: "QR" },
      qrTitle: { th: "สแกนเพื่อเปิดคลังเอกสาร", en: "Scan to open the library" },
      qrLead: {
        th: "QR นี้เปิดหน้าเอกสารทั้ง 8 ฉบับ ของ WetPROOF, RoofGUARD และ LOCKSURE",
        en: "This QR opens all eight WetPROOF, RoofGUARD and LOCKSURE documents."
      },
      qrDownload: { th: "ดาวน์โหลด QR", en: "Download QR" },
      qrPoster: { th: "ดาวน์โหลดโปสเตอร์", en: "Download poster" }
    };
    const products = [
      { brand:"wetproof", code:"110", slug:"wetproof-110", pages:6, name:"WetPROOF 110",
        type:{th:"เอกสารข้อมูลทางเทคนิค",en:"Technical Data Sheet"},
        tag:{th:"ซีเมนต์กันซึมชนิดยืดหยุ่น แบบส่วนประกอบเดียว",en:"One-component flexible cementitious waterproofing"},
        pack:{th:"20 กก./ถุง · 4 กก./ถัง",en:"20 kg bag · 4 kg pail"} },
      { brand:"wetproof", code:"120", slug:"wetproof-120", pages:6, name:"WetPROOF 120",
        type:{th:"เอกสารข้อมูลทางเทคนิค",en:"Technical Data Sheet"},
        tag:{th:"ซีเมนต์กันซึมชนิดยืดหยุ่น แบบ 2 ส่วนผสม พร้อมใช้",en:"Two-component ready-to-mix flexible cementitious waterproofing"},
        pack:{th:"ชุด 23 กก.",en:"23 kg set"} },
      { brand:"roofguard", code:"600", slug:"roofguard-600", pages:6, name:"RoofGUARD 600",
        type:{th:"เอกสารข้อมูลทางเทคนิค",en:"Technical Data Sheet"},
        tag:{th:"อะคริลิกกันซึมยืดหยุ่นสูง สำหรับหลังคาและดาดฟ้า",en:"Ultra-high-flexibility acrylic liquid waterproofing"},
        pack:{th:"4 กก. หรือ 20 กก.",en:"4 kg or 20 kg"} },
      { brand:"roofguard", code:"800", slug:"roofguard-800", pages:6, name:"RoofGUARD 800",
        type:{th:"เอกสารข้อมูลทางเทคนิค",en:"Technical Data Sheet"},
        tag:{th:"โพลียูรีเทนกันซึมยืดหยุ่นสูง สำหรับหลังคาและดาดฟ้า",en:"Ultra-high-flexibility polyurethane liquid waterproofing"},
        pack:{th:"4 กก. หรือ 20 กก.",en:"4 kg or 20 kg"} },
      { brand:"locksure", code:"541", slug:"locksure-541", pages:11, name:"LOCKSURE MS Flex 541",
        type:{th:"คู่มือการใช้งาน",en:"Method Statement"},
        tag:{th:"กาวยาแนวโมดิฟายด์ซิลิโคนพอลิเมอร์ ใช้งานได้หลากหลาย",en:"Modified-silicone (MS) polymer sealant — all-purpose"},
        pack:{th:"หลอด 300 มล.",en:"300 ml cartridge"} },
      { brand:"locksure", code:"181", slug:"locksure-181", pages:10, name:"LOCKSURE Acrylic Easy 181",
        type:{th:"คู่มือการใช้งาน",en:"Method Statement"},
        tag:{th:"กาวยาแนวอะคริลิกสูตรน้ำ แต่งง่าย ทาสีทับได้",en:"Water-based acrylic sealant — easy to tool, overpaintable"},
        pack:{th:"หลอด 300 มล.",en:"300 ml cartridge"} },
      { brand:"locksure", code:"221", slug:"locksure-221", pages:10, name:"LOCKSURE Silicone Easy 221",
        type:{th:"คู่มือการใช้งาน",en:"Method Statement"},
        tag:{th:"ซิลิโคนสูตรไร้กรด กันรา สำหรับห้องน้ำ",en:"Neutral-cure anti-mould silicone for wet rooms"},
        pack:{th:"หลอด 300 มล.",en:"300 ml cartridge"} },
      { brand:"locksure", code:"271", slug:"locksure-271", pages:10, name:"LOCKSURE Silicone Easy 271",
        type:{th:"คู่มือการใช้งาน",en:"Method Statement"},
        tag:{th:"ซิลิโคนสูตรกรด แห้งเร็ว สำหรับกระจกและอลูมิเนียม",en:"Acetoxy silicone — fast cure for glass and aluminium"},
        pack:{th:"หลอด 280 มล.",en:"280 ml cartridge"} }
    ];
    let lang = "th", brand = "all", query = "";
    const $ = (id) => document.getElementById(id);
    function t(copy) { return copy[lang]; }
    function render() {
      document.querySelectorAll("[data-i]").forEach((el) => { el.textContent = t(ui[el.dataset.i]); });
      $("q").placeholder = t(ui.search);
      $("btn-th").className = lang === "th" ? "on" : "";
      $("btn-en").className = lang === "en" ? "on" : "";
      $("chips").innerHTML = ["all","wetproof","roofguard","locksure"].map((id) => {
        const label = id === "all" ? t(ui.all) : id === "wetproof" ? "WetPROOF" : id === "roofguard" ? "RoofGUARD" : "LOCKSURE";
        return `<button type="button" data-brand="${id}" class="${brand===id?"on":""}">${label}</button>`;
      }).join("");
      const q = query.trim().toLowerCase();
      const list = products.filter((p) => {
        if (brand !== "all" && p.brand !== brand) return false;
        if (!q) return true;
        return [p.name, p.code, p.slug, p.tag.th, p.tag.en, p.type.th, p.type.en].join(" ").toLowerCase().includes(q);
      });
      $("empty").classList.toggle("hidden", list.length > 0);
      $("empty").textContent = t(ui.empty);
      $("grid").innerHTML = list.map((p) => `
        <article>
          <a class="cover" href="${CDN}/tds/${p.slug}.pdf" target="_blank" rel="noopener">
            <img src="${CDN}/covers/${p.slug}.jpg" alt="${p.name}" />
            <span class="badge">${p.code}</span>
          </a>
          <div class="body">
            <div>
              <p class="type">${t(p.type)}</p>
              <h3 class="name">${p.name}</h3>
              <p class="tag">${t(p.tag)}</p>
            </div>
            <p class="meta">${p.pages} ${t(ui.pages)} · ${t(p.pack)}</p>
            <div class="actions">
              <a class="btn ghost" href="${CDN}/tds/${p.slug}.pdf" target="_blank" rel="noopener">${t(ui.details)}</a>
              <a class="btn primary" href="${CDN}/tds/${p.slug}.pdf" download>${lang==="th"?"ดาวน์โหลด PDF":"Download PDF"}</a>
            </div>
          </div>
        </article>`).join("");
    }
    $("btn-th").onclick = () => { lang = "th"; render(); };
    $("btn-en").onclick = () => { lang = "en"; render(); };
    $("q").addEventListener("input", (e) => { query = e.target.value; render(); });
    $("chips").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      brand = b.dataset.brand;
      render();
    });
    render();
  </script>
</body>
</html>
